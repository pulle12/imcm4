<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularvalidierung</title>
    <meta name="description" content="Ein einfaches Programm, das IP-Adressen in Binärform umwandelt.">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Formularvalidierung</h1>
        <label for="usernameInput">Benutzername:</label></br>
        <input type="text" id="usernameInput" placeholder="Geben Sie einen Benutzernamen ein..."></br>
        <label for="passwordInput">Passwort:</label></br>
        <input type="text" id="passwordInput" placeholder="Geben Sie ein Passwort ein..."></br>
        <button id="convertButton" onclick="login()">Anmelden</button>
        <p id="loginMessage" hidden></p>
    </div>
    <script src="script.js" async defer></script>
</body>
</html>
