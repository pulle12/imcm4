<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aktien-Watchlist</title>
    <meta name="description" content="Ein einfaches Programm, das Wetterdaten abruft.">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="style.css">
    <script src="jquery-4.0.0.min.js"></script>
</head>
<body>
    <div class="container">
        <h1>Aktien-Watchlist</h1>
        <input type="text" id="stockInput" placeholder="Symbol (z.B. AAPL)">
        <button id="addStockButton">Hinzufügen</button>
        <table>
            <thead>
                <tr>
                    <th>Aktie</th>
                    <th>EOD Preis (USD)</th>
                    <th>Aktion</th>
                </tr>
            </thead>
            <tbody id="stock-table-body">
                
            </tbody>
        </table>
        <div id="loadingText"></div>
        <h2>Dein Suchverlauf</h2>
        <ul id="searchHistory"></ul>
        <div style="display: flex; gap: 20px; margin-top: 30px;">
            <div style="width: 50%;">
                <canvas id="lineGraph"></canvas>
            </div>
        </div>
    <script src="script.js" async defer></script>
</body>
</html>
