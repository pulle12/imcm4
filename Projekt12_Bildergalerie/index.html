<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bildergalerie</title>
    <meta name="description" content="Ein einfaches Programm, das IP-Adressen in Binärform umwandelt.">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Galerie</h1>
        <div class="gallery-container">
            <button id="vorheriges" class="nav-btn prev" onclick="meineGalerie.vorherigesBild()">
                <span>❮</span>
            </button>
            <div class="image-wrapper">
                <img id="bild" src="image1.png" alt="Galeriebild">
            </div>
            <button id="naechstes" class="nav-btn next" onclick="meineGalerie.naechstesBild()">
                <span>❯</span>
            </button>
        </div>
        <div class="info-bar">
            <span id="counter" class="counter">1 / 3</span>
        </div>
        <p id="loginMessage" hidden></p>
    </div>
    <script src="script.js" async defer></script>
</body>
</html>
