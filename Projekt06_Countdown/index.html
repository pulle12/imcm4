<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown-Timer</title>
    <meta name="description" content="Ein einfaches Programm zum Countdown bis zu einem bestimmten Datum.">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Countdown-Timer</h1>
    <p id="futureDate">Bis zum 24. Dezember 2025</p>
    <div class="countdown-container">
        <div class="countdown-box">
            <span id="days">00</span>
            <span class="label">Tage</span>
        </div>
        <div class="countdown-box">
            <span id="hours">00</span>
            <span class="label">Stunden</span>
        </div>
        <div class="countdown-box">
            <span id="minutes">00</span>
            <span class="label">Minuten</span>
        </div>
        <div class="countdown-box">
            <span id="seconds">00</span>
            <span class="label">Sekunden</span>
        </div>
    </div>
    <script src="script.js" async defer></script>
</body>
</html>
